<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>QuickLookRT</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><img src="icon.png" alt=""><b>DICOM RT</b><span id="version">macOS development</span></div><div class="identity"><strong id="title">DICOM</strong><span id="subtitle"></span></div><div class="header-actions"><button id="rtToggle">RT</button><button id="tagsToggle">Tags</button><button id="pngButton">PNG</button><button id="zipButton">ZIP</button><button id="settings" title="Settings">⚙</button></div></header>
<div id="notice" role="status">DICOM-Datei öffnen, um den Plan zu betrachten.</div>
<div class="workspace"><aside>
<section><label for="plans">RT</label><select id="plans"><option value="-1">Kein Plan</option></select><nav id="views" aria-label="Workspace"><button data-view="image">Image</button><button data-view="mlc">MLC</button><button data-view="dvh">DVH</button><button data-view="3d">3D</button></nav><div id="planstats" class="muted"></div><div id="registrationStatus" class="registration"></div><button id="sumButton">Σ Plan sum</button></section>
<section id="dosePanel"><label for="structures">Structure set</label><select id="structures"><option value="-1">Keine Strukturen</option></select><label for="doses">Dose</label><select id="doses"><option value="-1">Keine Dosis</option></select><div id="doseinfo" class="muted"></div><div class="checks"><label><input id="wash" type="checkbox" checked> Colorwash</label><label><input id="isodoses" type="checkbox"> Isodosen</label></div><details id="doseSettings"><summary>Dosis-Einstellungen</summary><div id="doseControls"></div></details><details><summary>Bildfusion</summary><div id="fusionControls"></div></details></section>
<div id="rtTabs"><button id="structuresTab" class="active">Structures</button><button id="dosesTab">Doses</button></div><section class="structure-section" id="structurePanel"><div class="section-title"><label for="search">Find structures</label><button id="all" class="textbutton">All</button><button id="none" class="textbutton">None</button></div><input type="search" id="search" placeholder="Find structures …"><select id="labelMode" aria-label="Konturbeschriftung"><option value="0">Name</option><option value="1">Description</option><option value="2">Both: name first</option><option value="3">Both: description first</option></select><label class="checklabel"><input id="hideX" type="checkbox"> x* ausblenden</label><div id="rois"></div></section>
<p class="footnote">Originaldateien bleiben unverändert.<br>Forschungs- und Inspektionswerkzeug.</p>
</aside><main>
<div id="modebar" class="toolbar"><div id="imageModes"><button data-mode="Native" title="Native">◩</button><button data-mode="Axial" title="Axial">▱</button><button data-mode="Coronal" title="Coronal">▤</button><button data-mode="Sagittal" title="Sagittal">▥</button><button data-mode="quad" title="MPR + 3D">▦ 2 × 2</button><button data-mode="3d" title="3D">◇ 3D</button></div><select id="series" aria-label="Base image series"><option value="-1">No images</option></select><button id="fusionButton" title="Registered image fusion">▣</button><button id="iso">ISO</button><button id="help" title="Info / F1">i</button><label><input id="fieldsToggle" type="checkbox"> Fields</label><button id="fit">Fit</button></div><div id="imagebar" class="toolbar"><select id="plane" aria-label="Bildebene"><option>Native</option><option>Axial</option><option>Coronal</option><option>Sagittal</option></select><select id="preset" aria-label="Fensterung"><option value="dicom">DICOM</option><option value="soft">Weichteil</option><option value="lung">Lunge</option><option value="bone">Knochen</option><option value="brain">Gehirn</option></select><label>W <input id="width" type="number" value="400" min="1" max="100000"></label><label>L <input id="level" type="number" value="40"></label><span class="muted">Scrollen: Schicht · ⌘ Scrollen: Zoom</span></div>
<div id="beamtools" class="toolbar hidden"><label for="beam" class="sr-only">Field</label><select id="beam"></select><button id="play">▶ Play</button><input type="range" id="cp" min="0" max="0" value="0" step="0.1" aria-label="Kontrollpunkt"><span id="cpreadout"></span><label><input id="drr" type="checkbox"> DRR</label></div>
<div id="surfacebar" class="toolbar hidden"></div><div id="mlcbar" class="toolbar hidden"></div><div id="stage"><div class="empty">Wähle eine DICOM-Datei.</div></div>
<div id="timeline" class="toolbar"><label id="slicelabel" for="slice">Slice</label><input type="range" id="slice" min="0" max="1" step="1" value="0"><span id="slicereadout"></span></div>
</main><aside id="tagsPanel" class="hidden"></aside></div><footer><span id="status">Bereit</span><div id="patientIdentity"></div><button id="discoverButton">Search subfolders …</button><button id="searchImagesButton">Search more images …</button></footer>
<dialog id="modal"><div id="modalContent"></div><button id="modalClose">Schließen</button></dialog><script src="graphics.js"></script><script src="app.js"></script><script src="features.js"></script></body></html>
