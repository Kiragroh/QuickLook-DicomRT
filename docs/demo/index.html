<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICOM RT · 0.2.2</title>
<style>
:root{color-scheme:dark;--bg:#101314;--surface:#182022;--ink:#eef4f5;--muted:#afbdc1;--accent:#65d8ce;--line:#344145}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 'Segoe UI Variable','Segoe UI',Arial,sans-serif;overflow:hidden}::selection{background:#65d8ce;color:#101314}*{scrollbar-color:#56696e #101314;scrollbar-width:thin}button{font:inherit;color:var(--muted);border:1px solid transparent;background:transparent;cursor:pointer;padding:8px 13px;border-radius:5px;min-height:42px}button:hover{background:#253031;color:var(--ink)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.3;cursor:default}header{height:66px;padding:14px 3vw;display:flex;align-items:center;gap:11px}header img{width:30px;height:30px}header span{font-size:14px;letter-spacing:.07em;color:var(--muted)}header .version{margin-left:auto;font-size:12px;letter-spacing:.03em}main{height:calc(100dvh - 128px);padding:18px 3vw 12px;display:grid;grid-template-columns:minmax(250px,.7fr) minmax(0,1.85fr);gap:3vw;align-items:center}.copy{align-self:center}h1{font-size:clamp(34px,3.6vw,64px);line-height:1.06;letter-spacing:-.035em;margin:0 0 26px;font-weight:600;white-space:pre-line;text-wrap:balance}.copy p{color:var(--muted);font-size:clamp(17px,1.3vw,22px);line-height:1.55;margin:0 0 20px;max-width:35ch}.visual{min-width:0;align-self:center}figure{margin:0;position:relative}figure img,figure video{display:block;width:100%;max-height:calc(100dvh - 238px);object-fit:contain;background:#080c0d}figure img{cursor:zoom-in}.visual:has(.choices) figure img{max-height:calc(100dvh - 296px)}figcaption{font-size:clamp(12px,.92vw,15px);line-height:1.45;color:var(--muted);margin-top:14px;max-width:100ch}.enlarge{position:absolute;right:10px;top:10px;background:#101314e8;color:#eef4f5;font-size:13px;border-color:#56696e}.choices{display:flex;gap:6px;margin-top:10px}.choices button{font-size:14px;border-bottom:2px solid transparent;border-radius:0}.choices button.active{color:var(--accent);border-bottom-color:var(--accent)}footer{height:62px;margin:0 3vw;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}footer .guide{margin-right:auto}#position{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.07em}.bar{position:fixed;bottom:0;left:0;height:3px;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s}.menu{position:fixed;inset:66px 3vw 72px;z-index:10;background:#151b1d;overflow:auto;padding:25px 35px;border:1px solid #3b4b50}.menu[hidden]{display:none}.menu h2{font-size:28px;font-weight:500}.menu ol{columns:2;column-gap:50px;list-style:none;padding:0;counter-reset:s}.menu li{break-inside:avoid;margin:6px 0}.menu button{text-align:left;width:100%;font-size:19px;padding:12px}.menu button:before{counter-increment:s;content:counter(s,decimal-leading-zero);font-size:13px;margin-right:20px;color:var(--accent)}dialog{border:1px solid var(--line);padding:44px 8px 8px;background:#080c0d;color:var(--ink);max-width:98vw;max-height:98dvh}dialog::backdrop{background:#000e}dialog img,dialog video{display:block;max-width:94vw;max-height:86dvh;object-fit:contain}dialog button{position:absolute;right:8px;top:2px;color:var(--ink);font-size:13px}dialog [hidden]{display:none}.cover{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding-top:2px}.cover .copy{display:flex;align-items:center;gap:24px;justify-content:space-between;width:100%}.cover h1{font-size:clamp(38px,4vw,68px);margin:0;letter-spacing:-.035em}.cover .copy p{margin:0;font-size:clamp(16px,1.4vw,23px);line-height:1.4;max-width:31ch}.reel{display:grid;grid-template-columns:minmax(0,3.7fr) minmax(110px,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;min-height:0;flex:1}.reel-tile{position:relative;display:block;padding:0;min-height:0;overflow:hidden;border:0;border-radius:0;background:#080c0d;text-align:left;grid-column:2}.reel-tile.active{grid-column:1;grid-row:1/5}.reel-tile video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.reel-tile .label{position:absolute;bottom:7px;left:9px;background:#101314ec;color:var(--ink);padding:2px 8px;font-size:12px}.reel-tile.active .label{bottom:14px;left:14px;padding:5px 12px;font-size:17px;color:var(--accent)}.reel-tile:hover .label{text-decoration:underline;text-underline-offset:4px}.hero-foot{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.hero-foot p{margin:0;margin-right:auto}.hero-foot button{font-size:12px;min-height:34px;padding:4px 10px;border-color:var(--line)}.fade{animation:appear .2s ease-out}@keyframes appear{from{opacity:.65}to{opacity:1}}@media(max-width:900px){header{height:56px}main{height:calc(100dvh - 112px);grid-template-columns:1fr;gap:10px;align-content:start;overflow:auto;padding-top:6px}.copy{padding:0;display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}h1{font-size:29px;margin-bottom:8px}.copy p{font-size:15px;margin-bottom:8px}.copy p:last-of-type{display:none}.visual img,.visual video{max-height:54dvh}.visual figcaption{font-size:12px}footer{height:56px}.guide{display:none}.menu ol{columns:1}.cover{overflow:hidden}.cover .copy{align-items:flex-start}.cover h1{font-size:36px}.cover .copy p{font-size:15px}.reel{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,4fr) minmax(0,1fr);gap:5px}.reel-tile{grid-column:auto;grid-row:2}.reel-tile.active{grid-column:1/5;grid-row:1}.reel-tile .label{bottom:3px;left:3px;font-size:10px;padding:1px 4px}.hero-foot p{font-size:11px}.hero-foot{gap:5px}.hero-foot button{padding:4px 6px}}@media(max-width:520px){header .version{font-size:10px}.cover .copy{display:block}.cover h1{font-size:36px}.cover .copy p{font-size:14px;max-width:none;margin-top:5px}.copy{display:block}.copy h1{font-size:26px;white-space:normal}.copy p{font-size:14px;max-width:none}.hero-foot p{display:none}.hero-foot{justify-content:flex-end}footer{gap:2px}footer button{font-size:12px;padding:7px 8px}.visual figcaption{font-size:11px}}@media(prefers-reduced-motion:reduce){.fade{animation:none}.bar{transition:none}}@media print{body{overflow:auto}header,footer,.bar,.menu{display:none}main{height:auto;display:block}figure img{max-height:none}dialog{display:none}}
</style></head><body>
<header><img src="media/logo.png" alt="DICOM RT logo"><span>DICOM RT</span><span class="version">QUICKLOOK · VERSION 0.2.2</span></header>
<main id="slide" aria-live="polite"></main>
<footer><span class="guide">Arrow keys to navigate · F for fullscreen · Enlarge any image or video</span><button id="toc" aria-label="Open contents">Contents</button><button id="prev">Previous</button><span id="position"></span><button id="next">Next</button><button id="full">Fullscreen</button></footer>
<div class="bar" id="progress"></div><section class="menu" id="menu" hidden><h2>Explore the viewer</h2><ol id="contents"></ol></section>
<dialog id="zoom" aria-label="Enlarged viewer capture"><button aria-label="Close enlarged capture">Close</button><img src="screens/image-clean.png" alt="Enlarged viewer capture" hidden><video controls loop muted playsinline hidden></video></dialog>
<script>
const slides=[{"title": "DICOM RT", "text": ["From the first slice to the whole plan.", "A space-bar preview for QuickLook."], "cover": true, "caption": "Actual viewer captures · select a view to bring it forward · select the large view to enlarge"}, {"title": "One file.\nThe whole folder.", "text": ["Select a DICOM file in Explorer and press Space. The image opens while the viewer indexes the immediate folder.", "Plans, structures and dose appear in the RT sidebar. The selected image stays central; tags are one panel away."], "image": "rt-overview.png", "caption": "The selected file opens first. Background indexing, progress reporting and cancellable rendering keep navigation responsive."}, {"title": "Keep moving\nthrough the series.", "text": ["Use the wheel or slice slider to browse the matching stack.", "The previous complete image stays visible until the next frame, overlays and labels are ready together."], "video": "01-scroll.mp4", "poster": "image-clean.png", "caption": "Actual CT states rendered by the viewer. Clips demonstrate behaviour; they are not screen-recorded latency measurements."}, {"title": "MPR + 3D.\nOne position.", "text": ["A 2 × 2 workspace links axial, coronal and sagittal slices with a 3D view. Click or scroll to update their shared position.", "Coordinate planes follow the crosshair. Human orientation badges mark patient left in turquoise and right in orange; the 3D badge follows the orbit."], "video": "07-mpr.mp4", "poster": "mpr-three.png", "caption": "Actual synchronized MPR + 3D. The shared human figure is a generic orientation cue. Native contours remain unchanged; reformatted boundaries are approximate."}, {"title": "Find it.\nFocus on it.", "text": ["Search targets and organs at risk. Checkboxes control visibility; All and None update the selection together.", "Click a structure name to navigate to it. In DVH, a name click emphasizes its curve; a second click restores the comparison."], "image": "structures-jump.png", "caption": "The name and checkbox have separate jobs. Visibility changes preserve already calculated DVH results."}, {"title": "Dose with\nroom to adjust.", "text": ["Show colorwash, isodose lines, both, or neither.", "Set opacity, lower and upper wash thresholds, and your own isodose levels. The same colours carry into the 3D dose preview."], "video": "04-dose.mp4", "poster": "dose-combined.png", "caption": "Percent levels refer to each dose object’s maximum. Stored units remain explicit; unknown dose coverage is not filled with zero."}, {"title": "Follow every\ncontrol point.", "text": ["Expand MLC into the centre and scrub across the whole plan. Beam-end markers make field boundaries visible.", "The linac schematic follows gantry and couch angles. A dashed yellow beam axis crosses isocentre; the human figure follows the beam’s patient setup."], "video": "02-mlc.mp4", "poster": "mlc.png", "caption": "Turquoise marks left hands and feet; orange marks right. The body-region cue is metadata-based or explicitly assumed. The figure is not registered anatomy. Playback speed is not treatment delivery timing."}, {"title": "Both MLC layers.\nOne view.", "text": ["Inspect both leaf banks and layers in plans that encode a dual-layer MLC.", "The timeline and orientation view stay together while the aperture changes. The underlying plan remains read only."], "video": "06-dual-mlc.mp4", "poster": "dual-layer-mlc.png", "caption": "Approved, sanitized MLC-only capture. No patient image, patient label or clinical identifier is shown."}, {"title": "Compare the curves.\nKeep the context.", "text": ["DVH uses 2,048 dose intervals with linear display interpolation and bounded spatial sampling.", "Click a name or row to thicken one curve and fade the others. Click again to restore all; use the checkbox to hide a curve."], "video": "05-dvh.mp4", "poster": "dvh-focused.png", "caption": "Results are cached by structure, dose and registration. Coverage and sampling remain visible. Approximate preview; no TPS-equivalence claim."}, {"title": "See the targets\ninside.", "text": ["Drag to orbit and use the wheel to zoom. CT skin starts at 6% opacity and has its own control, separate from ROI opacity.", "Large enclosing organs become more transparent to reveal targets. EXTERNAL contours stay excluded, including under All ROI types."], "video": "03-3d.mp4", "poster": "three-d-skin.png", "caption": "Actual structures with a generic orientation badge. Skin uses a CT threshold, not anatomical segmentation. Bounded meshes and transparency provide an approximate overview."}, {"title": "RT objects\nwithout a CT.", "text": ["Open an RTPLAN, RTSTRUCT or RTDOSE directly. The RT sidebar is useful before an image series is available.", "Inspect plan information and MLC. A matched structure set and dose can calculate a DVH without loading CT pixels."], "image": "rt-only.png", "caption": "Actual MLC control loaded from RTPLAN alone, without image pixels. This capture shows the standalone plan component, not the full viewer workspace."}, {"title": "Relationships\nmade explicit.", "text": ["Registered fusion aligns a selected overlay with a separate base image through an unambiguous supported spatial registration.", "Plan sum is offered only when more than one dose is available. Eligible physical Gy PLAN doses can be combined explicitly; exclusions and common coverage remain visible."], "image": "rt-overview.png", "caption": "This real benchmark contains no MR or REG and does not demonstrate image fusion or a multi-plan sum. Those capabilities are described here, not depicted. No fraction scaling is inferred."}, {"title": "Search inside\nthe DICOM tree.", "text": ["Search tag numbers, names, values and nested paths. Expand sequences and items yourself.", "A search opens matching ancestors. Clear it to return to your manual expansion state."], "image": "tags-collapsed.png", "choices": [["Tree", "tags-collapsed.png"], ["Sequence", "tags-expanded.png"], ["Search", "tags-search.png"]], "caption": "Actual plan metadata, with demo identifiers redacted. Binary payloads are excluded; long displayed and searchable values are bounded."}, {"title": "Local files.\nRead-only inspection.", "text": ["Browse the folder without changing source DICOM files. No persistent patient cache is created.", "Geometry, dose coverage and unsupported relationships remain explicit. The preview helps inspect data; it does not replace a treatment planning system."], "image": "three-d-dose.png", "caption": "Version 0.2.2 · Offline feature tour. No deformable registration. Supported image decoding and geometry remain subject to the viewer’s documented limits."}],reel=[{"label": "Slices", "video": "01-scroll.mp4", "poster": "image-clean.png"}, {"label": "Dose", "video": "04-dose.mp4", "poster": "dose-combined.png"}, {"label": "3D", "video": "03-3d.mp4", "poster": "three-d-skin.png"}, {"label": "DVH", "video": "05-dvh.mp4", "poster": "dvh-focused.png"}, {"label": "MLC", "video": "02-mlc.mp4", "poster": "mlc.png"}];let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.slice(1)||1)-1)),timer=null,reelIndex=0,paused=false;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const host=document.querySelector('#slide'),zoom=document.querySelector('#zoom'),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function play(v){v.play().catch(()=>{});}
function enlarge(src,isVideo=false,poster=''){clearInterval(timer);const image=zoom.querySelector('img'),video=zoom.querySelector('video');image.hidden=isVideo;video.hidden=!isVideo;if(isVideo){video.src=src;video.poster=poster;play(video)}else image.src=src;host.querySelectorAll('video').forEach(v=>v.pause());zoom.showModal();}
function updateReel(n){reelIndex=n;host.querySelectorAll('.reel-tile').forEach((tile,i)=>{tile.classList.toggle('active',i===n);tile.setAttribute('aria-pressed',String(i===n));tile.setAttribute('aria-label',reel[i].label+(i===n?' — enlarge video':' — bring forward'));});}
function resetTimer(){clearInterval(timer);timer=null;if(!paused&&!reducedMotion&&index===0&&!zoom.open)timer=setInterval(()=>updateReel((reelIndex+1)%reel.length),6000);}
function motion(){host.querySelectorAll('video').forEach(v=>paused?v.pause():play(v));const b=host.querySelector('#motion');if(b){b.textContent=paused?'Play previews':'Pause previews';b.setAttribute('aria-pressed',String(!paused));}resetTimer();}
function show(n){clearInterval(timer);host.querySelectorAll('video').forEach(v=>v.pause());index=Math.max(0,Math.min(slides.length-1,n));const s=slides[index];host.className=(s.cover?'cover ':'')+'fade';
if(s.cover){host.innerHTML=`<div class="copy"><h1>${esc(s.title)}</h1><p>${esc(s.text[0])}<br>${esc(s.text[1])}</p></div><div class="reel">${reel.map((r,i)=>`<button class="reel-tile ${i===reelIndex?'active':''}" data-reel="${i}" aria-pressed="${i===reelIndex}"><video muted loop playsinline preload="auto" poster="screens/${r.poster}" aria-hidden="true"><source src="media/${r.video}" type="video/mp4"></video><span class="label">${esc(r.label)}</span></button>`).join('')}</div><div class="hero-foot"><p>${esc(s.caption)}</p><button id="motion"></button><button id="hero-enlarge">Enlarge preview</button></div>`;host.querySelectorAll('[data-reel]').forEach(b=>b.onclick=()=>{const i=+b.dataset.reel;if(i===reelIndex){const v=b.querySelector('video');enlarge(v.currentSrc||v.querySelector('source').src,true,v.poster)}else{updateReel(i);resetTimer()}});host.querySelector('#motion').onclick=()=>{paused=!paused;motion()};host.querySelector('#hero-enlarge').onclick=()=>{const v=host.querySelector('.active video');enlarge(v.currentSrc||v.querySelector('source').src,true,v.poster)};updateReel(reelIndex);motion();
}else{const label=esc(s.title.replaceAll('\n',' '));const media=s.video?`<video controls loop muted playsinline preload="metadata" poster="screens/${s.poster}" aria-label="${label}"><source src="media/${s.video}" type="video/mp4"></video>`:`<img src="screens/${s.image}" alt="${label}" loading="eager">`;host.innerHTML=`<div class="copy"><h1>${esc(s.title)}</h1>${s.text.map(t=>`<p>${esc(t)}</p>`).join('')}</div><div class="visual"><figure>${media}<button class="enlarge">Enlarge ${s.video?'video':'image'}</button><figcaption>${esc(s.caption)}</figcaption></figure>${s.choices?'<div class="choices">'+s.choices.map((c,i)=>`<button class="${i===0?'active':''}" aria-pressed="${i===0}" data-src="${c[1]}">${esc(c[0])}</button>`).join('')+'</div>':''}</div>`;const open=()=>{const v=host.querySelector('video'),image=host.querySelector('figure img');enlarge(v?(v.currentSrc||v.querySelector('source').src):image.src,!!v,v?.poster||'')};host.querySelector('.enlarge').onclick=open;host.querySelector('figure img')?.addEventListener('click',open);host.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{host.querySelector('figure img').src='screens/'+b.dataset.src;host.querySelectorAll('.choices button').forEach(a=>{a.classList.toggle('active',a===b);a.setAttribute('aria-pressed',String(a===b))})});const video=host.querySelector('video');if(video&&!paused)play(video);}
document.querySelector('#position').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===slides.length-1;document.querySelector('#progress').style.transform='scaleX('+((index+1)/slides.length)+')';history.replaceState(null,'','#'+(index+1));document.title=s.title.replaceAll('\n',' ')+' · DICOM RT 0.2.2';document.querySelector('#menu').hidden=true;}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#full').onclick=fullscreen;document.querySelector('#toc').onclick=()=>{const m=document.querySelector('#menu');m.hidden=!m.hidden};document.querySelector('#contents').innerHTML=slides.map((s,i)=>`<li><button data-index="${i}">${esc(s.title.replaceAll('\n',' '))}</button></li>`).join('');document.querySelectorAll('#contents button').forEach(b=>b.onclick=()=>show(+b.dataset.index));zoom.querySelector('button').onclick=()=>zoom.close();zoom.addEventListener('click',e=>{if(e.target===zoom)zoom.close()});zoom.addEventListener('close',()=>{zoom.querySelector('video').pause();motion()});document.addEventListener('keydown',e=>{if(zoom.open)return;if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape')document.querySelector('#menu').hidden=true;if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer);host.querySelectorAll('video').forEach(v=>v.pause())}else if(!zoom.open)motion()});show(index);
</script></body></html>
