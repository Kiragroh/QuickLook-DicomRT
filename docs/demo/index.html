*{box-sizing:border-box}body{margin:0;background:#0c1015;color:#eef5fc;font-family:"Segoe UI",Arial,sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;background:#182531;border:1px solid #354655;border-radius:8px;padding:9px 13px}button:hover,a:hover{border-color:#64b5f6;color:#b6dfff}a{color:#91ccff;text-underline-offset:4px}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:1px solid #243440;font-size:13px;gap:15px}.brand{font-weight:650;letter-spacing:.05em}.version{color:#9eafbd;margin-left:16px}main{height:calc(100dvh - 119px);overflow:auto}article{min-height:100%;display:grid;grid-template-columns:minmax(290px,31%) 1fr;align-items:center;gap:3vw;padding:3vw}.copy{max-width:550px}.eyebrow{color:#64b5f6;font-size:12px;font-weight:700;letter-spacing:.15em}h1{font-size:clamp(30px,3.5vw,60px);line-height:1.04;letter-spacing:-.045em;white-space:pre-line;margin:18px 0 24px}p{font-size:clamp(15px,1.3vw,21px);line-height:1.5;color:#b9c9d8}.note{font-size:12px;line-height:1.45;color:#8fa4b5}.visual img,.visual video{display:block;width:100%;max-height:calc(100dvh - 220px);object-fit:contain;background:#101315;border:1px solid #344554;border-radius:10px;box-shadow:0 22px 70px #0006}.visual video{cursor:pointer}.tools{display:flex;gap:8px;margin-top:12px;align-items:center}.tools span{font-size:11px;color:#8fa4b5;margin-left:auto}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.actions a{display:inline-block;border:1px solid #3b617c;padding:12px 15px;border-radius:8px;text-decoration:none;font-size:14px}.actions a.primary{background:#7bc4fc;color:#0a1825;font-weight:700}.repo{font-size:clamp(15px,1.8vw,28px);word-break:break-word}.hero{position:relative;display:block;padding:2vh 3vw;overflow:hidden}.hero .visual{width:min(1180px,92vw);margin:auto}.hero .visual img{max-height:calc(100dvh - 290px);border-color:#46647a}.hero .copy{max-width:none;display:flex;align-items:center;justify-content:space-between;gap:30px;margin:18px auto 0;width:min(1180px,92vw)}.hero h1{font-size:clamp(26px,3vw,46px);margin:8px 0;white-space:normal}.hero p{font-size:16px;margin:5px 0}.hero .tools{display:none}.hero .eyebrow{font-size:11px}footer{height:59px;display:flex;align-items:center;gap:10px;padding:0 3vw;border-top:1px solid #243440}#position{margin-left:auto;color:#91a7b9;font-variant-numeric:tabular-nums}#progress{height:3px;position:fixed;bottom:0;left:0;background:#64b5f6;transform-origin:left;width:100%}dialog{color:#eef5fc;background:#10151b;border:1px solid #526d83;border-radius:12px;width:min(1450px,96vw);max-height:94vh;padding:18px}dialog::backdrop{background:#000d}dialog img,dialog video{display:block;width:100%;max-height:78vh;object-fit:contain}dialog .close{float:right;margin-bottom:12px}#chapters{position:fixed;inset:60px auto 59px 0;width:min(440px,90vw);background:#111c27;border-right:1px solid #3c566c;padding:20px;overflow:auto;z-index:5}#chapters button{display:block;width:100%;text-align:left;margin-bottom:8px}#chapters[hidden]{display:none}@media(max-width:850px){article{grid-template-columns:1fr;padding:22px;gap:16px}.copy{max-width:none}h1{font-size:36px;margin:12px 0}p{font-size:16px}.visual img,.visual video{max-height:55vh}.hero .copy{display:block}.hero .visual img{max-height:54vh}.version{display:none}header a{font-size:11px}.hero{overflow:auto}.tools span{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

'use strict';const slides=[{"k": "SPACE → RT", "title": "The whole plan.\nOne Space away.", "text": ["DICOM RT for QuickLook · Windows", "Images, dose, structures and field geometry—without importing into a TPS."], "image": "hero-quad-fields.png", "hero": true}, {"k": "01 / OPEN", "title": "Start with\nthe file you have.", "text": ["Select a DICOM file in Explorer. Press Space.", "CT and MR open as images. RTPLAN opens MLC. RTSTRUCT and RTDOSE open their 3D workspace—even without CT."], "image": "rt-only.png"}, {"k": "02 / EXPLORE", "title": "Four views.\nOne position.", "text": ["Axial, coronal, sagittal and 3D stay linked. Drag the crosshair or scroll through slices.", "The active field, isocenter, contours and dose share the same spatial context. Ctrl + wheel zooms."], "video": "mpr.mp4", "image": "hero-quad-fields.png"}, {"k": "03 / FIELDS", "title": "See where\nthe beam comes from.", "text": ["Choose the active field. Follow its control points in the image, MLC or 3D workspace.", "Moving gantries show their path and angular meterset modulation. The collimator-oriented aperture moves on the arc, facing isocenter."], "video": "orbit.mp4", "image": "three-d-fields.png", "note": "Angular modulation is MU per degree, not measured dose rate. Playback is not delivery timing."}, {"k": "04 / MLC", "title": "The aperture.\nThe anatomy behind it.", "text": ["Turn on the CT-derived DRR. Adjust MLC opacity to balance leaf visibility and anatomy.", "Project PTV, organ and other outlines. The structure list now highlights enabled outlines in their own colors; uncheck individual structures to simplify the view."], "video": "mlc.mp4", "image": "mlc-outlines.png"}, {"k": "05 / OUTLINES", "title": "Know which\ncontours are on.", "text": ["Outline: enabled and highlighted in contour color.", "Group off: its PTV / Organ / Other switch is off. Hidden: individually unchecked. No match: no compatible spatial association."], "image": "mlc-outlines.png", "note": "The category and individual checkbox both determine the MLC projection."}, {"k": "06 / DOSE", "title": "Dose you can\nread at a glance.", "text": ["Choose colorwash, isodoses, or both. Edit line colors and levels, with compact opacity controls.", "Go to Dose maximum. Plan changes navigate to isocenter, or Dmax when no isocenter is available. Gy edits stay local; relative levels can be applied globally."], "image": "dose-controls.png"}, {"k": "07 / DVH", "title": "Focus the curve.\nKeep the comparison.", "text": ["Click a curve or structure name to emphasize its DVH. Click again to restore all curves. Hover a curve for its name, volume and dose metrics; no recalculation needed.", "Right-click to export active curves, with or without metrics: Dmean, Dmedian, Dmax, Dmin, D98 and D2. Export names include patient and relevant plan IDs."], "video": "dvh.mp4", "image": "dvh-focused.png", "note": "Approximate DVH preview with explicit dose coverage; not TPS-equivalence validation."}, {"k": "08 / TAGS", "title": "Full DICOM\ntag search.", "text": ["Search numbers, names, values and nested sequences. Matching branches open automatically.", "Clear the search and keep your place. Double-click a tag to copy its number, label or value."], "video": "tags.mp4", "image": "tags-search.png", "note": "Search covers retained text; binary payloads are excluded and long values are marked when truncated."}, {"k": "09 / LOAD WHAT YOU NEED", "title": "More context.\nOn your terms.", "text": ["The RT menu separates plans, individual doses and structure sets. Plans explicitly show whether matching images are loaded.", "Search more images loads matching series on demand. Search subfolders discovers additional RT. Unrelated image volumes stay unloaded; switching RT never leaves unrelated anatomy behind."], "image": "rt-hierarchy.png", "note": "Large folders still require metadata discovery. Loading and rendering are prepared in the background."}, {"k": "10 / PLAN SUMS & WORKFLOW", "title": "Choose the data.\nKeep the context.", "text": ["Compatible doses form explicit sum groups. Choose the contributing plans and Generate sum; included plans stay visible.", "Screenshot the whole viewer with PNG / Ctrl + Shift + S, or right-click one view to save that view. Info / F1 has grouped shortcut tables and developer links."], "image": "dose-controls.png", "note": "This approved case has one plan. Plan sums, MR/REG and dual-layer MLC are supported but not demonstrated by this dataset."}, {"k": "11 / THE 30-SECOND TOUR", "title": "See it\nin half a minute.", "text": ["A compact overview of the viewer, captured in 0.2.20.", "Actual captures from the approved public nonpatient multimets benchmark. Upbeat original music; edited timing, not a performance measurement."], "video": "announcement-30s.mp4", "image": "hero-quad-fields.png", "film": true}, {"k": "AVAILABLE NOW", "title": "Install it on\nyour Windows PC.", "text": ["Get the installer, source and feature changelog on GitHub.", "QuickLook for Windows is the host. Requires a compatible .NET Framework runtime; DICOM source files remain unchanged."], "image": "hero-quad-fields.png", "closing": true, "note": "Research and inspection preview; not a clinically validated TPS."}], embedded=JSON.parse(document.getElementById('assets').textContent),urls=new Map();document.getElementById('assets').remove();
function media(path){if(!embedded[path])return path;if(urls.has(path))return urls.get(path);const item=embedded[path],parts=[];for(let i=0;i<item.data.length;i+=1048576){const raw=atob(item.data.slice(i,i+1048576));parts.push(Uint8Array.from(raw,c=>c.charCodeAt(0)))}const url=URL.createObjectURL(new Blob(parts,{type:item.type}));urls.set(path,url);delete item.data;return url}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=0;const stage=document.getElementById('stage'),zoom=document.getElementById('zoom'),chapters=document.getElementById('chapters');
const repo='https://github.com/Kiragroh/QuickLook-DicomRT';
function actions(){return `<div class="actions"><a class="primary" href="${repo}/releases/latest/download/QuickLook-DicomRT-Setup-0.2.21.exe">Download Windows installer</a><a href="${repo}/blob/main/CHANGELOG.md">Feature changelog</a></div>`}
function visual(s,expanded=false){return s.video?`<video ${expanded?'autoplay':''} controls playsinline ${s.film?'':'muted loop'} preload="metadata" poster="${media('screens/'+s.image)}" src="${media('media/'+s.video)}" aria-label="${esc(s.title.replaceAll('\n',' '))}"></video>`:`<img src="${media('screens/'+s.image)}" alt="${esc(s.title.replaceAll('\n',' '))}">`}
function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];const copy=`<div class="copy"><div><div class="eyebrow">${esc(s.k)}</div><h1>${esc(s.title)}</h1>${s.text.map(t=>`<p>${esc(t)}</p>`).join('')}${s.closing?`<a class="repo" href="${repo}">github.com/Kiragroh/QuickLook-DicomRT</a>${actions()}`:''}${s.note?`<p class="note">${esc(s.note)}</p>`:''}</div>${s.hero?'<button id="watch">Watch the 30-second film ▶</button>':''}</div>`;const view=`<div class="visual">${visual(s)}<div class="tools"><button id="enlarge">Enlarge view ⤢</button><span>Actual viewer capture · approved nonpatient case</span></div></div>`;stage.innerHTML=`<article class="${s.hero?'hero':''}">${s.hero?view+copy:copy+view}</article>`;stage.scrollTop=0;document.getElementById('enlarge')?.addEventListener('click',()=>{document.getElementById('expanded').innerHTML=visual(s,true);zoom.showModal()});document.getElementById('watch')?.addEventListener('click',()=>show(slides.findIndex(x=>x.film)));document.getElementById('position').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('progress').style.transform=`scaleX(${(index+1)/slides.length})`;chapters.hidden=true;document.getElementById('menu').setAttribute('aria-expanded','false');try{history.replaceState(null,'','#'+(index+1))}catch(e){if(e.name!=='SecurityError')throw e}}
chapters.innerHTML=slides.map((s,i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.k)}</button>`).join('');chapters.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i));document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('menu').onclick=()=>{chapters.hidden=!chapters.hidden;document.getElementById('menu').setAttribute('aria-expanded',String(!chapters.hidden))};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()};document.getElementById('close').onclick=()=>zoom.close();zoom.addEventListener('close',()=>document.getElementById('expanded').innerHTML='');document.addEventListener('keydown',e=>{if(zoom.open||e.target.closest('video,input,select,textarea'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});show((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
